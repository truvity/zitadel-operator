name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # The same recipe the shared workflow runs everywhere else, instead of
  # a hand-rolled copy that installed devbox through an UNPINNED
  # `curl | bash` -- eight repositories carried that identical block.
  #
  # Deliberately NOT in ci.yaml's recipe list, and deliberately not a
  # required context. A standard-library advisory with no released fix
  # would otherwise wedge every pull request on a finding nobody can act
  # on, which is exactly what happened to pulumi-zitadel.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@b3fb5012588fbb178b6159212bc9c4a785e99d01 # v2.3.0
    with:
      recipes: '["vuln"]'

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif
        if: always()
