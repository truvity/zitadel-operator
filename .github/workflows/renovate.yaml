# Self-hosted Renovate, daily — the shared implementation.
#
# The App identity is carried by the CREDENTIAL NAMES, not by the
# workflow: it reads vars.RENOVATE_CLIENT_ID and
# secrets.RENOVATE_APP_PRIVATE_KEY, org-level on the public estate. The
# shared workflow skips cleanly while the variable is unset, so the file
# is safe to carry before the entitlement exists.
#
# What this buys a PUBLIC repository specifically: nothing else moves
# the ci-workflows pins in ci.yaml — a repo without renovate is a repo
# whose pins can never move (github-actions.md, gitops).
#
# `secrets: inherit` is mandatory. A called workflow receives none of the
# caller's secrets otherwise; `vars` resolve and secrets do not, and the
# failure reads as "'client-id' … must be set to a non-empty string",
# which looks like a malformed workflow rather than a missing entitlement.
name: Renovate

on:
  schedule:
    - cron: "0 0 * * *" # daily midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    uses: truvity/ci-workflows/.github/workflows/renovate.yaml@681547390267ac3474ffed005d0723a9dd202b3d # v2.12.2
    secrets: inherit
