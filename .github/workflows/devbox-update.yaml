name: Devbox Update

on:
  schedule:
    - cron: "0 1 * * 1" # weekly Monday 1am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The hand-rolled copy this replaces passed `app-id:
  # ${{ secrets.RENOVATE_APP_ID }}`, a secret this org no longer sets, so
  # every weekly run died on "The 'client-id' (or deprecated 'app-id')
  # input must be set to a non-empty string" before it reached devbox.
  # The shared workflow selects the App by this repository's own
  # RENOVATE_CLIENT_ID variable, and `secrets: inherit` is what makes the
  # private key reach it at all. Same migration gitops completed in
  # INF-556 — this repository was simply left behind.
  update:
    uses: truvity/ci-workflows/.github/workflows/devbox-update.yaml@42ab84ed2ddc8649b0c6eddd16a623482dbb754a # v2.10.0
    secrets: inherit
